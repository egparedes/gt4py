# Phase 0 probe for the sandboxed agent review (see agent-review plan):
# AWF setup, API proxy against CSCS, security canaries, spend controls.
# Test-only: runs on pushes to ci/awf-probe-* branches of a personal fork.
name: Agent review AWF probe

on:
  push:
    branches:
      - "ci/awf-probe-*"

permissions:
  contents: read

env:
  AWF_VERSION: v0.29.12
  CSCS_OPENAI_BASE_URL: https://api.inference.cscs.ch/v1

jobs:
  # Q1: does the setup action work with no token permissions at all?
  setup-no-permissions:
    if: ${{ !contains(github.event.head_commit.message, '[canary-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Setup AWF
        id: awf
        uses: github/gh-aw-firewall@7dc485464a58130d6ac2e73fe632424eb5d06823 # v0.29.12
        with:
          version: ${{ env.AWF_VERSION }}
          pull-images: "true"
      - name: Report
        env:
          AWF_OUT_VERSION: ${{ steps.awf.outputs.version }}
          AWF_IMAGE_TAG: ${{ steps.awf.outputs.image-tag }}
        run: |
          echo "PROBE setup(permissions: {}) version=$AWF_OUT_VERSION"
          echo "PROBE image-tag=$AWF_IMAGE_TAG"
          awf --version

  # Q3 with the real key: one chat completion, one tool call, /v1/messages,
  # allowedModels enforcement. Prints status, model, usage and truncated text only.
  real-key:
    # Spends CSCS tokens: only when the commit message asks for it.
    if: contains(github.event.head_commit.message, '[real-key]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Detect CSCS key
        id: key
        env:
          HAS_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY != '' }}
        run: |
          echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::CSCS_INFERENCE_API_KEY is not set; skipping the real-key probe."
          fi

      - name: Checkout probe scripts
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup AWF
        if: steps.key.outputs.present == 'true'
        id: awf
        uses: github/gh-aw-firewall@7dc485464a58130d6ac2e73fe632424eb5d06823 # v0.29.12
        with:
          version: ${{ env.AWF_VERSION }}
          pull-images: "true"

      - name: Install probe files read-only under /opt
        if: steps.key.outputs.present == 'true'
        run: |
          sudo install -d -m 0755 /opt/awf-probe
          sudo install -m 0755 .github/awf-probe/*.sh .github/awf-probe/*.py /opt/awf-probe/
          sudo install -m 0644 .github/awf-probe/*.yaml /opt/awf-probe/
          ls -la /opt/awf-probe
          awf --version
          awf --help > "$RUNNER_TEMP/awf-help.txt" 2>&1 || true
          grep -nE -- '--(openai-base-url-env|reflect|rate-limit-rpm|work-dir|audit-dir|agent-timeout|image-tag)' "$RUNNER_TEMP/awf-help.txt" || true

      - name: Run listeners against CSCS (real key, output redacted)
        if: steps.key.outputs.present == 'true'
        timeout-minutes: 10
        env:
          OPENAI_API_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
          AWF_IMAGE_TAG: ${{ steps.awf.outputs.image-tag }}
          PROBE_MODEL_CANDIDATES: ${{ vars.AWF_PROBE_MODEL || 'zai-org/GLM-5.3-Flash Qwen/Qwen3.8-Flash-Next-FP8' }}
        run: |
          set +e
          # Every line (awf logs and probe output) goes through the redactor,
          # which hides any fragment of the key.
          # sudo resets PATH (secure_path); the action installs awf under
          # $RUNNER_TEMP/awf-bin, so call it by absolute path.
          sudo -E "$(command -v awf)" \
            --config /opt/awf-probe/awf-cscs.yaml \
            --image-tag "$AWF_IMAGE_TAG" \
            --audit-dir "$RUNNER_TEMP/awf-audit" \
            -e PROBE_MODEL_CANDIDATES="$PROBE_MODEL_CANDIDATES" \
            -- bash /opt/awf-probe/real-key.sh 2>&1 \
            | python3 -I /opt/awf-probe/redact.py OPENAI_API_KEY
          echo "PROBE awf exit=${PIPESTATUS[0]}"
          exit 0

      - name: Token usage (redacted)
        if: always() && steps.key.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.CSCS_INFERENCE_API_KEY }}
        run: |
          sudo find "$RUNNER_TEMP/awf-audit" -maxdepth 3 -type f -printf '%p %s\n' 2>/dev/null | head -50
          for f in $(sudo find "$RUNNER_TEMP/awf-audit" /tmp -name 'token-usage*.jsonl' 2>/dev/null); do
            echo "== $f"
            sudo cat "$f" | head -c 6000 | python3 -I /opt/awf-probe/redact.py OPENAI_API_KEY
            echo
          done

  # Q2: security canaries with a DUMMY key, once with AWF's default work dir and
  # once with --work-dir under $RUNNER_TEMP.
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workdir: [default, runner-temp, proxy-logs-dir, allow-write-openai, allow-write-home]
    steps:
      - name: Checkout probe scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup AWF
        id: awf
        uses: github/gh-aw-firewall@7dc485464a58130d6ac2e73fe632424eb5d06823 # v0.29.12
        with:
          version: ${{ env.AWF_VERSION }}
          pull-images: "true"

      - name: Prepare host (read-only /opt files, a host service, runner paths)
        id: prep
        run: |
          sudo install -d -m 0755 /opt/awf-probe
          sudo install -m 0755 .github/awf-probe/*.sh .github/awf-probe/*.py /opt/awf-probe/
          sudo install -m 0644 .github/awf-probe/*.yaml /opt/awf-probe/
          ls -lad /opt /opt/awf-probe; getfacl -p /opt 2>/dev/null | head -12
          # A host service, to test whether the agent can reach host ports.
          mkdir -p "$RUNNER_TEMP/hostsvc" && echo host-service > "$RUNNER_TEMP/hostsvc/index.html"
          (cd "$RUNNER_TEMP/hostsvc" && nohup python3 -m http.server 18080 --bind 0.0.0.0 >/dev/null 2>&1 &)
          (cd "$RUNNER_TEMP/hostsvc" && nohup python3 -m http.server 18081 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          echo "PROBE host: listening TCP sockets on the runner:"; sudo ss -ltnpH | sed 's/^/PROBE   /'
          echo "PROBE host: listening UDP sockets on the runner:"; sudo ss -lunpH | sed 's/^/PROBE   /'
          worker=$(pgrep -f Runner.Worker | head -1)
          runner_dir=$(dirname "$(dirname "$(readlink -f "/proc/$worker/exe")")")
          echo "runner_dir=$runner_dir" >> "$GITHUB_OUTPUT"
          echo "PROBE host: runner dir $runner_dir; HOME=$HOME; RUNNER_TEMP=$RUNNER_TEMP"
          ls -la "$HOME" | head -40
          ls -la /tmp | head -40

      - name: Run canary inside AWF (dummy key)
        env:
          AWF_IMAGE_TAG: ${{ steps.awf.outputs.image-tag }}
          MODE: ${{ matrix.workdir }}
          RUNNER_DIR: ${{ steps.prep.outputs.runner_dir }}
        run: |
          set +e
          TS=$(date +%s); sleep 1
          # The dummy exists only in this step's environment, like a real
          # secret passed through step env. Never in a file, GITHUB_ENV or output.
          OPENAI_API_KEY="AWFCANARY-k$(openssl rand -hex 16)"
          ANTHROPIC_API_KEY="$OPENAI_API_KEY"
          export OPENAI_API_KEY ANTHROPIC_API_KEY
          KEY_SHA=$(printf '%s' "$OPENAI_API_KEY" | sha256sum | cut -d' ' -f1)
          # Positive control: a decoy of the same shape (prefix -d), planted in
          # /tmp and in the agent env. The scanner must find it.
          DECOY="AWFCANARY-d$(openssl rand -hex 16)"
          echo "$DECOY" > /tmp/awf-probe-decoy.txt
          WD_ARGS=(); PROBE_WORK_DIR=""
          CFG=/opt/awf-probe/awf-cscs.yaml
          mkdir -p "$GITHUB_WORKSPACE/probe-out"
          PROXY_LOGS=""
          if [ "$MODE" = runner-temp ] || [ "$MODE" = proxy-logs-dir ]; then
            WD_ARGS=(--work-dir "$RUNNER_TEMP/awf"); PROBE_WORK_DIR="$RUNNER_TEMP/awf"
          fi
          if [ "$MODE" = proxy-logs-dir ]; then
            PROXY_LOGS="$RUNNER_TEMP/awf-proxy-logs"; WD_ARGS+=(--proxy-logs-dir "$PROXY_LOGS")
          fi
          if [[ "$MODE" == allow-write-* ]]; then
            # v0.29.12 fails to start if these tmpfs-mask mountpoints are
            # missing once /tmp is read-only; pre-create them.
            # (allowWrite + --work-dir under $RUNNER_TEMP also fails to start:
            # the work-dir mask mountpoint cannot be created.)
            mkdir -p /tmp/gh-aw/sandbox/firewall/audit /tmp/gh-aw/sandbox/firewall/logs /tmp/gh-aw/mcp-logs
            # Only the listed host paths stay writable; every other host bind
            # mount (workspace, /tmp, ~/.config, ...) should become read-only.
            CFG="$RUNNER_TEMP/awf-allow-write.yaml"
            { cat /opt/awf-probe/awf-cscs.yaml
              printf 'filesystem:\n  allowWrite:\n    - %s\n' "$GITHUB_WORKSPACE/probe-out"
              # The entrypoint writes ~/.claude.json when an Anthropic key is set.
              [ "$MODE" = allow-write-home ] && printf '    - %s\n' "$HOME"
            } > "$CFG"
            # Without an Anthropic key the entrypoint skips the Claude helper.
            [ "$MODE" = allow-write-openai ] && unset ANTHROPIC_API_KEY
            cat "$CFG"
          fi
          # Host-side watcher: where does the key live while awf runs?
          : > "$RUNNER_TEMP/key-locations.txt"
          (
            for i in $(seq 1 1200); do
              sudo -E bash -c 'grep -rlF -e "$OPENAI_API_KEY" /tmp "$RUNNER_TEMP" /run /var/lib/docker/containers /etc 2>/dev/null' >> "$RUNNER_TEMP/key-locations.txt"
              sudo find /tmp -maxdepth 1 -name 'runc-*' -printf 'perm:%m %u:%g %p\n' 2>/dev/null >> "$RUNNER_TEMP/key-locations.txt"
              for c in awf-api-proxy awf-agent awf-squid; do
                sudo -E bash -c 'docker inspect "$0" --format "{{json .Config.Env}}" 2>/dev/null | grep -qF -e "$OPENAI_API_KEY"' "$c" \
                  && echo "docker-inspect-env:$c" >> "$RUNNER_TEMP/key-locations.txt"
              done
              sleep 0.5
            done
          ) &
          WATCHER=$!
          sudo -E "$(command -v awf)" \
            --config "$CFG" \
            --image-tag "$AWF_IMAGE_TAG" \
            --log-level debug \
            --agent-timeout 15 \
            "${WD_ARGS[@]}" \
            --audit-dir "$RUNNER_TEMP/awf-audit" \
            -e PROBE_KEY_SHA256="$KEY_SHA" -e PROBE_TS="$TS" -e PROBE_DECOY="$DECOY" \
            -e PROBE_WORKSPACE="$GITHUB_WORKSPACE" -e PROBE_RUNNER_TEMP="$RUNNER_TEMP" \
            -e PROBE_GITHUB_ENV="$GITHUB_ENV" -e PROBE_GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            -e PROBE_GITHUB_PATH="$GITHUB_PATH" -e PROBE_RUNNER_DIR="$RUNNER_DIR" \
            -e PROBE_HOST_HOME="$HOME" -e PROBE_WORK_DIR="$PROBE_WORK_DIR" \
            -e PROBE_OUT="$GITHUB_WORKSPACE/probe-out" -e PROBE_PROXY_LOGS_DIR="$PROXY_LOGS" \
            -- bash /opt/awf-probe/canary.sh > "$RUNNER_TEMP/awf-output.txt" 2>&1
          echo "PROBE awf exit=$?"
          kill "$WATCHER" 2>/dev/null; sleep 1
          # Print the awf output with the dummy replaced (it is not secret, but
          # this keeps the log greppable for real leaks of the shape only).
          sed -E 's/AWFCANARY-k[0-9a-f]{32}/<CANARY-KEY-SHAPE>/g' "$RUNNER_TEMP/awf-output.txt"
          echo "PROBE host: key occurrences in awf stdout/stderr: $(grep -cF -e "$OPENAI_API_KEY" "$RUNNER_TEMP/awf-output.txt")"
          echo "PROBE host: key locations during run: $(sort -u "$RUNNER_TEMP/key-locations.txt" | tr '\n' ' ')"
          echo "PROBE host: key locations after run: $(sudo -E bash -c 'grep -rlF -e "$OPENAI_API_KEY" /tmp "$RUNNER_TEMP" "$HOME" "$GITHUB_WORKSPACE" /run /var/lib/docker/containers 2>/dev/null' | tr '\n' ' ')"
          for p in "$GITHUB_WORKSPACE" /tmp /var/tmp /dev/shm "$HOME" "$HOME/.config" "$HOME/.config/git" \
                   "$HOME/.cache" "$HOME/.local/bin" "$HOME/.local/share" "$HOME/.npm" "$HOME/.cargo" \
                   "$HOME/.claude" "$HOME/.copilot" "$HOME/.ssh" /opt /opt/awf-probe /usr/local/bin /etc /root \
                   "$RUNNER_TEMP" "$PROBE_WORK_DIR"; do
            [ -z "$p" ] && continue
            if sudo test -e "$p/.awf-probe-write-marker"; then
              echo "PROBE host: marker PERSISTED on host at $p"; sudo rm -f "$p/.awf-probe-write-marker"
            fi
          done
          echo "PROBE host: home after run:"; ls -la "$HOME" "$HOME/.claude" "$HOME/.m2" "$HOME/.gradle" 2>&1 | head -60
          echo "PROBE host: /tmp after run:"; sudo ls -la /tmp | head -60
          [ -n "$PROBE_WORK_DIR" ] && { echo "PROBE host: work dir:"; sudo ls -la "$PROBE_WORK_DIR"; }
          echo "PROBE host: AWF log dirs after run:"
          for d in /tmp/api-proxy-logs-* /tmp/squid-logs-* /tmp/awf-agent-logs-* ${PROXY_LOGS:+$PROXY_LOGS $PROXY_LOGS/*}; do
            [ -e "$d" ] || continue
            echo "PROBE host:   $d -> $(sudo stat -c '%F %a %U:%G' "$d") $( [ -L "$d" ] && readlink "$d")"
            [ -d "$d" ] && sudo ls -la "$d" | sed 's/^/PROBE host:     /'
          done
          for f in $(sudo find /tmp/api-proxy-logs-* ${PROXY_LOGS:+"$PROXY_LOGS"} -name 'token-usage.jsonl' 2>/dev/null); do
            echo "PROBE host: $f: lines=$(sudo wc -l < "$f") planted_marker=$(sudo grep -c PLANTED-BY-AGENT "$f")"
          done
          echo "PROBE host: symlink target contents: $(ls -la "$GITHUB_WORKSPACE/probe-out/symlink-target" 2>&1 | tr '\n' ';')"
          echo "PROBE host: auth-header strings in AWF logs: $(sudo grep -rliE 'authorization|x-api-key|bearer ' /tmp/api-proxy-logs-* /tmp/squid-logs-* ${PROXY_LOGS:+"$PROXY_LOGS"} 2>/dev/null | tr '\n' ' ')"
          exit 0

      - name: Did the sandbox inject into GITHUB_ENV?
        run: |
          echo "PROBE GITHUB_ENV injection -> AWF_PROBE_INJECTED=${AWF_PROBE_INJECTED:-unset}"
          echo "PROBE AWF_TOKEN_USAGE_LOG=${AWF_TOKEN_USAGE_LOG:-unset}"

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          sudo cp -r "$RUNNER_TEMP/awf-audit" "$GITHUB_WORKSPACE/probe-out" "$RUNNER_TEMP/evidence/" 2>/dev/null
          sudo cp "$RUNNER_TEMP/awf-output.txt" "$RUNNER_TEMP/evidence/" 2>/dev/null
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/evidence"
          sed -i -E 's/AWFCANARY-k[0-9a-f]{32}/<CANARY-KEY-SHAPE>/g' "$RUNNER_TEMP/evidence/awf-output.txt" 2>/dev/null
          ls -laR "$RUNNER_TEMP/evidence" | head -60

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-${{ matrix.workdir }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7

  # Q3/Q4 without a key: path mapping, auth headers, allowedModels, maxTurns,
  # rate limit, agentTimeout, against a local echo upstream on the host.
  proxy-echo:
    if: ${{ !contains(github.event.head_commit.message, '[canary-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout probe scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup AWF
        id: awf
        uses: github/gh-aw-firewall@7dc485464a58130d6ac2e73fe632424eb5d06823 # v0.29.12
        with:
          version: ${{ env.AWF_VERSION }}
          pull-images: "true"

      - name: Install probe files
        run: |
          sudo install -d -m 0755 /opt/awf-probe
          sudo install -m 0755 .github/awf-probe/*.sh .github/awf-probe/*.py /opt/awf-probe/
          sudo install -m 0644 .github/awf-probe/*.yaml /opt/awf-probe/

      - name: Run proxy probes against the local echo upstream
        env:
          AWF_IMAGE_TAG: ${{ steps.awf.outputs.image-tag }}
        run: |
          set +e
          OPENAI_API_KEY="echo-dummy-$(openssl rand -hex 12)"
          ANTHROPIC_API_KEY="$OPENAI_API_KEY"
          export OPENAI_API_KEY ANTHROPIC_API_KEY
          PROBE_ECHO_KEY="$OPENAI_API_KEY" nohup python3 -I /opt/awf-probe/echo_server.py 18080 "$RUNNER_TEMP/echo.jsonl" >"$RUNNER_TEMP/echo.err" 2>&1 &
          sleep 1
          curl -sS -m 5 http://127.0.0.1:18080/v1/models; echo
          for mode in turns rpm; do
            for host in host.docker.internal 172-30-0-1.sslip.io; do
              echo "::group::mode=$mode upstream host=$host"
              : > "$RUNNER_TEMP/echo.jsonl"
              sed "s/@ECHO_HOST@/$host/" "/opt/awf-probe/awf-echo-$mode.yaml" > "$RUNNER_TEMP/awf-echo.yaml"
              extra=()
              [ "$host" = host.docker.internal ] && extra=(--enable-host-access)
              PROBE_ECHO_OPENAI_BASE_URL="http://$host:18080/v1" \
              sudo -E "$(command -v awf)" \
                --config "$RUNNER_TEMP/awf-echo.yaml" \
                --image-tag "$AWF_IMAGE_TAG" \
                --log-level debug \
                "${extra[@]}" \
                -- bash /opt/awf-probe/proxy.sh "$mode" 2>&1 \
                | sed -e "s/$OPENAI_API_KEY/<DUMMY>/g"
              echo "PROBE awf exit=${PIPESTATUS[0]} (mode=$mode host=$host)"
              echo "::endgroup::"
              echo "PROBE echo upstream saw $(wc -l < "$RUNNER_TEMP/echo.jsonl") request(s) (mode=$mode host=$host):"
              sed -e "s/$OPENAI_API_KEY/<DUMMY>/g" "$RUNNER_TEMP/echo.jsonl" | sed 's/^/PROBE   upstream /'
              for f in $(sudo find /tmp -maxdepth 2 -path '/tmp/api-proxy-logs-*' -type f -newer "$RUNNER_TEMP/awf-echo.yaml" 2>/dev/null); do
                echo "PROBE sidecar log $f:"; sudo head -c 4000 "$f" | sed -e "s/$OPENAI_API_KEY/<DUMMY>/g"; echo
              done
              [ -s "$RUNNER_TEMP/echo.jsonl" ] && break
            done
          done
          cat "$RUNNER_TEMP/echo.err"
          exit 0

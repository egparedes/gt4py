- case: my_plugin
  mypy_config:
    plugins = functional.ffront.experiments.plugin
  main: |
    from functional.ffront.experiments.builtins import Field

    field = Field[["I", "E2V"], float]
    reveal_type(field)

  out: |
    main:3: note: Revealed type is "Field"



